services:
  app:
    build:
      context: .
    image: ai-resume-match:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      API_TOKEN: ${API_TOKEN}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY}
      SESSION_TTL: ${SESSION_TTL:-30d}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AI_API_KEY: ${AI_API_KEY}
      AI_ENDPOINT: ${AI_ENDPOINT}
      AI_MODEL: ${AI_MODEL}
      ANALYSIS_ENGINE: ${ANALYSIS_ENGINE:-agent}
      ANALYSIS_SCHEDULING_ENABLED: ${ANALYSIS_SCHEDULING_ENABLED:-true}
      ANALYSIS_RATE_LIMIT_ENABLED: ${ANALYSIS_RATE_LIMIT_ENABLED:-true}
      ANALYSIS_RATE_LIMIT_MAX_REQUESTS: ${ANALYSIS_RATE_LIMIT_MAX_REQUESTS:-5}
      ANALYSIS_RATE_LIMIT_WINDOW: ${ANALYSIS_RATE_LIMIT_WINDOW:-10m}
      AGENT_SERVICE_URL: http://agent:8000
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN}
      AGENT_READ_TIMEOUT: ${AGENT_READ_TIMEOUT:-60s}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:-5s}
      RESUME_MAX_FILE_SIZE: ${RESUME_MAX_FILE_SIZE:-5MB}
      RESUME_MAX_PDF_PAGES: ${RESUME_MAX_PDF_PAGES:-50}
      RESUME_MAX_DOCX_ENTRIES: ${RESUME_MAX_DOCX_ENTRIES:-512}
      RESUME_MAX_DOCX_ENTRY_SIZE: ${RESUME_MAX_DOCX_ENTRY_SIZE:-10MB}
      RESUME_MAX_DOCX_UNCOMPRESSED_SIZE: ${RESUME_MAX_DOCX_UNCOMPRESSED_SIZE:-20MB}
      REPORT_CACHE_TTL: ${REPORT_CACHE_TTL:-10m}
      ANALYSIS_RUNNING_TIMEOUT: ${ANALYSIS_RUNNING_TIMEOUT:-15m}
      ANALYSIS_RUNNING_RECOVERY_FIXED_DELAY_MS: ${ANALYSIS_RUNNING_RECOVERY_FIXED_DELAY_MS:-30000}
      ANALYSIS_RUNNING_RECOVERY_BATCH_SIZE: ${ANALYSIS_RUNNING_RECOVERY_BATCH_SIZE:-20}
      ANALYSIS_OUTBOX_FIXED_DELAY_MS: ${ANALYSIS_OUTBOX_FIXED_DELAY_MS:-5000}
      ANALYSIS_OUTBOX_BATCH_SIZE: ${ANALYSIS_OUTBOX_BATCH_SIZE:-20}
      ANALYSIS_OUTBOX_MAX_ATTEMPTS: ${ANALYSIS_OUTBOX_MAX_ATTEMPTS:-10}
      ANALYSIS_OUTBOX_RETRY_DELAY: ${ANALYSIS_OUTBOX_RETRY_DELAY:-30s}
      ANALYSIS_OUTBOX_RETRY_MAX_DELAY: ${ANALYSIS_OUTBOX_RETRY_MAX_DELAY:-15m}
      ANALYSIS_OUTBOX_RETRY_JITTER_RATIO: ${ANALYSIS_OUTBOX_RETRY_JITTER_RATIO:-0.2}
      ANALYSIS_OUTBOX_CONFIRM_TIMEOUT: ${ANALYSIS_OUTBOX_CONFIRM_TIMEOUT:-5s}
      ANALYSIS_OUTBOX_LEASE_DURATION: ${ANALYSIS_OUTBOX_LEASE_DURATION:-30s}
      ANALYSIS_RETENTION_FIXED_DELAY_MS: ${ANALYSIS_RETENTION_FIXED_DELAY_MS:-3600000}
      ANALYSIS_RETENTION_BATCH_SIZE: ${ANALYSIS_RETENTION_BATCH_SIZE:-200}
      ANALYSIS_OUTBOX_RETENTION: ${ANALYSIS_OUTBOX_RETENTION:-30d}
      ANALYSIS_IDEMPOTENCY_RETENTION: ${ANALYSIS_IDEMPOTENCY_RETENTION:-30d}
      ANALYSIS_USER_DATA_RETENTION: ${ANALYSIS_USER_DATA_RETENTION:-30d}
      SCHEDULER_SHUTDOWN_TIMEOUT: ${SCHEDULER_SHUTDOWN_TIMEOUT:-10s}
      ANALYSIS_RETRY_DELAY: ${ANALYSIS_RETRY_DELAY:-1m}
      ANALYSIS_RETRY_MAX_DELAY: ${ANALYSIS_RETRY_MAX_DELAY:-15m}
      ANALYSIS_RETRY_JITTER_RATIO: ${ANALYSIS_RETRY_JITTER_RATIO:-0.2}
      ANALYSIS_RETRY_SCHEDULER_FIXED_DELAY_MS: ${ANALYSIS_RETRY_SCHEDULER_FIXED_DELAY_MS:-30000}
      ANALYSIS_RETRY_BATCH_SIZE: ${ANALYSIS_RETRY_BATCH_SIZE:-20}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: ./agent-service
    image: ai-resume-match-agent:local
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_ENDPOINT: ${AI_ENDPOINT}
      AI_MODEL: ${AI_MODEL}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-45}
      AGENT_ANALYSIS_TIMEOUT_SECONDS: ${AGENT_ANALYSIS_TIMEOUT_SECONDS:-50}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-6}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_MAX_PROTOCOL_ERRORS: ${AGENT_MAX_PROTOCOL_ERRORS:-2}
      AGENT_MAX_COMPLETION_TOKENS: ${AGENT_MAX_COMPLETION_TOKENS:-1200}
      AGENT_MAX_TOTAL_TOKENS: ${AGENT_MAX_TOTAL_TOKENS:-50000}
      AGENT_MAX_CONTEXT_CHARS: ${AGENT_MAX_CONTEXT_CHARS:-100000}
      AGENT_MAX_CONCURRENT_ANALYSES: ${AGENT_MAX_CONCURRENT_ANALYSES:-4}
      AGENT_CAPACITY_ACQUIRE_TIMEOUT_SECONDS: ${AGENT_CAPACITY_ACQUIRE_TIMEOUT_SECONDS:-0.1}
      AGENT_MODEL_PRICING_VERSION: ${AGENT_MODEL_PRICING_VERSION:-}
      AGENT_MODEL_INPUT_COST_USD_PER_MILLION_TOKENS: ${AGENT_MODEL_INPUT_COST_USD_PER_MILLION_TOKENS:-}
      AGENT_MODEL_OUTPUT_COST_USD_PER_MILLION_TOKENS: ${AGENT_MODEL_OUTPUT_COST_USD_PER_MILLION_TOKENS:-}
      AGENT_TRACING_ENABLED: ${AGENT_TRACING_ENABLED:-false}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT_SECONDS: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT_SECONDS:-5}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-resume-match-agent}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
      RETRIEVER_MODE: ${RETRIEVER_MODE:-hashing}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-15}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      DENSE_MIN_SIMILARITY: ${DENSE_MIN_SIMILARITY:-0.35}
    ports:
      - "${AGENT_SERVICE_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: ai-resume-match-frontend:local
    environment:
      API_TOKEN: ${API_TOKEN}
      NGINX_ENVSUBST_FILTER: "^API_TOKEN$"
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
