global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ai-resume-match-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080

  - job_name: ai-resume-match-agent
    metrics_path: /metrics
    static_configs:
      - targets:
          - agent:8000
