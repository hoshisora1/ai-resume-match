spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

springdoc:
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}

api:
  token: ${API_TOKEN}
  session-signing-key: ${SESSION_SIGNING_KEY}
  session-cookie-secure: ${SESSION_COOKIE_SECURE:true}

ai:
  api-key: ${AI_API_KEY}

agent:
  base-url: ${AGENT_SERVICE_URL}
  token: ${AGENT_SERVICE_TOKEN}

analysis:
  engine: ${ANALYSIS_ENGINE}
