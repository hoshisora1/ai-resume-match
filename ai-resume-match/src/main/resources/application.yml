spring:
  application:
    name: ai-resume-match
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:mysql://localhost:3306/ai_resume_match?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

ai:
  endpoint: https://api.openai.com/v1/chat/completions
  api-key: ${AI_API_KEY}
  model: gpt-4o-mini

api:
  token: ${API_TOKEN}

report:
  cache-ttl: 10m

analysis:
  running-timeout: 15m
  outbox:
    fixed-delay-ms: 5000
    batch-size: 20
    retry-delay: 30s
    confirm-timeout: 5s
  retry:
    delay: 1m
    scheduler-fixed-delay-ms: 30000
    batch-size: 20
