spring:
  datasource:
    url: jdbc:h2:mem:ai_resume_match;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

ai:
  endpoint: http://localhost/mock
  api-key: test-key
  model: test-model

api:
  token: test-token

report:
  cache-ttl: 10m

analysis:
  running-timeout: 15m
