spring:
  datasource:
    url: jdbc:h2:mem:ai_resume_match;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

ai:
  endpoint: http://localhost/mock
  api-key: test-key
  model: test-model

agent:
  base-url: http://localhost:8000
  token: test-agent-token
  connect-timeout: 3s
  read-timeout: 60s

api:
  token: test-token
  session-signing-key: test-session-signing-key-at-least-32-characters
  session-ttl: 30d
  session-cookie-secure: false

report:
  cache-ttl: 10m

analysis:
  engine: agent
  rate-limit:
    enabled: false
    max-requests: 5
    window: 10m
  scheduling:
    enabled: false
  running-timeout: 15m
  running-recovery:
    scheduler-fixed-delay-ms: 30000
    batch-size: 20
  outbox:
    fixed-delay-ms: 5000
    batch-size: 20
    max-attempts: 10
    retry-delay: 30s
    retry-max-delay: 15m
    retry-jitter-ratio: 0.2
    confirm-timeout: 5s
    lease-duration: 30s
  retention:
    scheduler-fixed-delay-ms: 3600000
    batch-size: 200
    outbox: 30d
    idempotency: 30d
    user-data: 30d
  retry:
    delay: 1m
    max-delay: 15m
    jitter-ratio: 0.2
    scheduler-fixed-delay-ms: 30000
    batch-size: 20

resume:
  upload:
    max-file-size: 5MB
    max-pdf-pages: 50
    max-docx-entries: 512
    max-docx-entry-size: 10MB
    max-docx-uncompressed-size: 20MB
