name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-fast:
    name: Java / fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-resume-match
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ai-resume-match/pom.xml

      - name: Run fast tests
        run: mvn --batch-mode --no-transfer-progress test

  java-integration:
    name: Java / Testcontainers verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-resume-match
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ai-resume-match/pom.xml

      - name: Run integration verification
        run: mvn --batch-mode --no-transfer-progress verify

  python-agent:
    name: Python Agent / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-resume-match/agent-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-resume-match/agent-service/pyproject.toml

      - name: Install Agent test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Agent tests
        run: python -m pytest

      - name: Run deterministic retrieval baseline
        run: >-
          python evals/run_retrieval_eval.py
          --min-recall 0.88
          --min-mrr 0.86
          --max-false-positive-rate 0
          --summary-only

  frontend-quality:
    name: Frontend / quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-resume-match/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai-resume-match/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated API contract
        run: npm run api:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run component tests
        run: npm run test

      - name: Build production assets
        run: npm run build

  browser-e2e:
    name: Browser / Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ai-resume-match/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai-resume-match/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Compose configurations
        working-directory: ai-resume-match
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.demo.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml config --quiet

      - name: Verify deterministic model protocol
        run: npm run test:e2e-protocol

      - name: Run deterministic browser tests
        run: npm run test:e2e

      - name: Run full-stack browser test
        run: npm run test:e2e:full-stack
